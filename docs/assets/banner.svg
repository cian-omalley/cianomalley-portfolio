<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Cian O'Malley — The Digital District: interactive cyberpunk developer portfolio">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#3A006F" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#12002b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#040805" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C8CDD8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#040805"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- horizon skyline silhouette -->
  <g fill="#0B1010" stroke="#3A006F" stroke-width="1">
    <rect x="60"  y="220" width="46" height="100"/>
    <rect x="118" y="196" width="30" height="124"/>
    <rect x="160" y="240" width="58" height="80"/>
    <rect x="980" y="206" width="40" height="114"/>
    <rect x="1032" y="234" width="60" height="86"/>
    <rect x="1104" y="188" width="34" height="132"/>
  </g>
  <!-- window lights -->
  <g fill="#7C3AED" opacity="0.8">
    <rect x="70" y="232" width="5" height="5"/><rect x="86" y="252" width="5" height="5"/>
    <rect x="126" y="210" width="5" height="5"/><rect x="126" y="236" width="5" height="5"/>
    <rect x="176" y="252" width="5" height="5"/><rect x="196" y="270" width="5" height="5"/>
    <rect x="990" y="220" width="5" height="5"/><rect x="1006" y="244" width="5" height="5"/>
    <rect x="1048" y="248" width="5" height="5"/><rect x="1070" y="266" width="5" height="5"/>
    <rect x="1112" y="202" width="5" height="5"/><rect x="1124" y="228" width="5" height="5"/>
  </g>
  <g fill="#22D3EE" opacity="0.9">
    <rect x="86" y="228" width="4" height="4"/><rect x="132" y="258" width="4" height="4"/>
    <rect x="1060" y="242" width="4" height="4"/><rect x="1118" y="252" width="4" height="4"/>
  </g>

  <!-- orbital ring -->
  <ellipse cx="600" cy="150" rx="380" ry="86" fill="none" stroke="#7C3AED" stroke-opacity="0.28" stroke-width="1.5"/>
  <ellipse cx="600" cy="150" rx="380" ry="86" fill="none" stroke="#C8CDD8" stroke-opacity="0.10" stroke-width="4" stroke-dasharray="2 14"/>
  <circle cx="222" cy="168" r="4" fill="#22D3EE"/>
  <circle cx="978" cy="132" r="4" fill="#7C3AED"/>

  <!-- title -->
  <g font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="54" font-weight="700" letter-spacing="10" fill="#7C3AED" filter="url(#blur)" opacity="0.9">CIAN O'MALLEY</text>
    <text x="600" y="140" font-size="54" font-weight="700" letter-spacing="10" fill="#F5F7FA">CIAN O'MALLEY</text>
    <text x="600" y="186" font-size="21" font-weight="500" letter-spacing="14" fill="#C8CDD8">THE DIGITAL DISTRICT</text>
  </g>

  <rect x="300" y="212" width="600" height="2" fill="url(#line)"/>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" text-anchor="middle">
    <text x="600" y="246" font-size="15" letter-spacing="2" fill="#89919E">INTERACTIVE CYBERPUNK DEVELOPER PORTFOLIO</text>
    <text x="600" y="278" font-size="13" letter-spacing="1" fill="#89919E">WordPress&#160;&#160;·&#160;&#160;Oxygen 6&#160;&#160;·&#160;&#160;ACF Pro&#160;&#160;·&#160;&#160;Three.js&#160;&#160;·&#160;&#160;YouTube Data API</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 24 24 h 26 M 24 24 v 26"/>
    <path d="M 1176 24 h -26 M 1176 24 v 26"/>
    <path d="M 24 296 h 26 M 24 296 v -26"/>
    <path d="M 1176 296 h -26 M 1176 296 v -26"/>
  </g>
</svg>
