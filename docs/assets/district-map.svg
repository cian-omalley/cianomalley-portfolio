<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-label="Map of the Digital District: Arrival Platform hub connected to seven destinations — Project Sector, Knowledge Archive, Tutorial Studio, Review Laboratory, Identity Chamber, Communications Relay, and Experimental Sector">
  <defs>
    <radialGradient id="hubfill" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#3A006F"/>
      <stop offset="100%" stop-color="#0B1010"/>
    </radialGradient>
    <radialGradient id="bgglow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3A006F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#040805" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="680" rx="14" fill="#040805"/>
  <rect width="960" height="680" rx="14" fill="url(#bgglow)"/>
  <text x="480" y="44" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#C8CDD8">THE DIGITAL DISTRICT — WORLD MAP</text>

  <!-- ring path connecting the outer districts -->
  <path d="M 480 118 L 768 216 L 828 396 L 640 568 L 320 568 L 132 396 L 192 216 Z"
        fill="none" stroke="#C8CDD8" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- spokes from hub -->
  <g stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="480" y1="350" x2="480" y2="146"/>
    <line x1="480" y1="350" x2="740" y2="230"/>
    <line x1="480" y1="350" x2="796" y2="392"/>
    <line x1="480" y1="350" x2="626" y2="540"/>
    <line x1="480" y1="350" x2="334" y2="540"/>
    <line x1="480" y1="350" x2="164" y2="392"/>
    <line x1="480" y1="350" x2="220" y2="230"/>
  </g>
  <!-- data pulses on spokes -->
  <g fill="#22D3EE">
    <circle cx="480" cy="240" r="3.5"/>
    <circle cx="622" cy="285" r="3.5"/>
    <circle cx="660" cy="374" r="3.5"/>
    <circle cx="560" cy="454" r="3.5"/>
    <circle cx="396" cy="459" r="3.5"/>
    <circle cx="300" cy="374" r="3.5"/>
    <circle cx="332" cy="282" r="3.5"/>
  </g>

  <!-- hub -->
  <g filter="url(#softglow)">
    <circle cx="480" cy="350" r="78" fill="url(#hubfill)" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="480" cy="350" r="90" fill="none" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 6"/>
  </g>
  <g text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
    <text x="480" y="340" font-size="15" font-weight="700" fill="#F5F7FA">① ARRIVAL</text>
    <text x="480" y="360" font-size="15" font-weight="700" fill="#F5F7FA">PLATFORM</text>
    <text x="480" y="382" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#22D3EE">/</text>
  </g>

  <!-- district nodes -->
  <g font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <!-- Project Sector (top) -->
    <rect x="384" y="90" width="192" height="56" rx="10" fill="#0B1010" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="480" y="113" font-size="14" font-weight="600" fill="#F5F7FA">② Project Sector</text>
    <text x="480" y="133" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/projects/</text>

    <!-- Knowledge Archive (upper right) -->
    <rect x="672" y="188" width="192" height="70" rx="10" fill="#0B1010" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="768" y="212" font-size="14" font-weight="600" fill="#F5F7FA">③ Knowledge Archive</text>
    <text x="768" y="232" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/guides/ · /articles/</text>
    <text x="768" y="248" font-size="11" fill="#89919E">written tutorials &amp; posts</text>

    <!-- Tutorial Studio (right) -->
    <rect x="732" y="368" width="192" height="70" rx="10" fill="#0B1010" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="828" y="392" font-size="14" font-weight="600" fill="#F5F7FA">④ Tutorial Studio</text>
    <text x="828" y="412" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/videos/ · /series/</text>
    <text x="828" y="428" font-size="11" fill="#89919E">YouTube-synced lessons</text>

    <!-- Review Laboratory (lower right) -->
    <rect x="544" y="540" width="192" height="56" rx="10" fill="#0B1010" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="640" y="563" font-size="14" font-weight="600" fill="#F5F7FA">⑤ Review Laboratory</text>
    <text x="640" y="583" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/reviews/</text>

    <!-- Identity Chamber (lower left) -->
    <rect x="224" y="540" width="192" height="56" rx="10" fill="#0B1010" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="320" y="563" font-size="14" font-weight="600" fill="#F5F7FA">⑥ Identity Chamber</text>
    <text x="320" y="583" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/about/</text>

    <!-- Communications Relay (left) -->
    <rect x="36" y="368" width="192" height="70" rx="10" fill="#0B1010" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="132" y="392" font-size="14" font-weight="600" fill="#F5F7FA">⑦ Communications Relay</text>
    <text x="132" y="412" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/contact/</text>
    <text x="132" y="428" font-size="11" fill="#89919E">form · socials · CV</text>

    <!-- Experimental Sector (upper left) -->
    <rect x="96" y="188" width="192" height="70" rx="10" fill="#0B1010" stroke="#FF315B" stroke-width="1.5"/>
    <text x="192" y="212" font-size="14" font-weight="600" fill="#F5F7FA">⑧ Experimental Sector</text>
    <text x="192" y="232" font-size="12" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#89919E">/lab/</text>
    <text x="192" y="248" font-size="11" fill="#FF315B">prototypes — rough edges</text>
  </g>

  <!-- legend -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">
    <circle cx="316" cy="644" r="4" fill="#22D3EE"/>
    <text x="328" y="648" fill="#89919E">interactive hotspot</text>
    <line x1="490" y1="644" x2="522" y2="644" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="532" y="648" fill="#89919E">camera path</text>
    <line x1="650" y1="644" x2="682" y2="644" stroke="#C8CDD8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="692" y="648" fill="#89919E">district ring</text>
  </g>
</svg>
